schema_version: 1

service:
  name: afra-nezamvazife-status
  provider: afra
  domain: test
  version: 1.0.0  

mode: pure


server:                           # all optional
  port: 8080                      # default: 8080 (env PORT overrides at runtime)
  read_timeout: 10s               # default: 10s
  write_timeout: 30s              # default: 30s (keep > upstream.timeout * (retries+1))
  shutdown_timeout: 15s           # default: 15s
  max_body_bytes: 1048576         # default: 1 MiB


logging:
  filePath: ./logs/
  fileName: processor-app.log
  encoding: json
  level: debug
  console: true
  rotating:
    maxSize: 10       # Max size in MB before rotation
    maxBackups: 5     # Number of old log files to keep
    maxAge: 7         # Max age in days to retain old log files
    compress: true    # Compress old log files



endpoints:
  - name: afra-nezamvazife-status
    method: POST
    path: /v1/afra/nezamvazife/status
    params:
      - { name: nationalCode, in: body, required: true, pattern: '^[0-9]{10}$'}
      - { name: birthDate, in: body, required: true}
     
    upstream:
      base_url: http://inquiryps.fam724.ir
      path: /afra/proxy/nezamvazife/1.0/services/368/GetLastConscriptStatusV3
      body:
        username: "melalbank"
        password: "946325ETL[SFnn475Xe]650"
        nationalCode: "{{ nationalCode }}"
        birthDate: "{{ birthDate }}"
            
      headers:
        bundle-id: 37e7eeeff79b485a971fd686945dfd93
        USER_KEY: fe00797b-dba7-487b-8bf0-5c2ce902309e
    response:
      status: 200
      map:
        status : "$.result"
        description : "$.description"
        expirationDate : "$.expirationDate"
        errorCode : "$.errorCode"
        errorMessage : "$.errorMessage"

    business_errors:
      - when: { path: "@status", equals: 401 }
        status: 502
        code: UPSTREAM_UNAUTHORIZED
        message: "provider rejected the credentials"

      - when: { path: "@status", equals: 403 }
        status: 502
        code: UPSTREAM_FORBIDDEN
        message: "provider refused the request"

      - when: { path: "@status", equals: 429 }
        status: 502
        code: UPSTREAM_TOO_MANY_REQUEST
        message: "provider refused the request"

      - when: { path: "@status", equals: 400 }
        status: 502
        code: UPSTREAM_BAD_REQUEST
        message: "provider rejected the request due to invalid parameters"