schema_version: 1

service:
  name: person-inquiry-get-image
  provider: astan
  domain: test
  version: 1.0.0                  # default: 0.1.0

mode: pure

server:                           # all optional
  port: 8080                      # default: 8080 (env PORT overrides at runtime)
  read_timeout: 10s               # default: 10s
  write_timeout: 30s              # default: 30s (keep > upstream.timeout * (retries+1))
  shutdown_timeout: 15s           # default: 15s
  max_body_bytes: 1048576         # default: 1 MiB


logging:
  filePath: ./logs/
  fileName: processor-app.log
  encoding: json
  level: info
  console: true
  rotating:
    maxSize: 10       # Max size in MB before rotation
    maxBackups: 5     # Number of old log files to keep
    maxAge: 7         # Max age in days to retain old log files
    compress: true    # Compress old log files

########################################
endpoints:
  - name: person-inquiry-get-image
    method: POST
    path: /v1/astan/person/get-image
    params:
      - { name: nationalCode, in: body, required: true, pattern: '^[0-9]{10}$' }      
      - { name: cardSerial,    in: body, required: true, pattern: '^\d[A-Z]\d{8}$' }  
    ########################################
    upstream:
      auth:
        type: basic
        username: { source: env, value: INQUIRY_USERNAME }
        password: { source: env, value: INQUIRY_PASSWORD }
      base_url: http://inquiryps.fam724.ir
      path: /hadafmandi/GetImageSmart
      body:
        arg0: "meas"
        arg1: "M!e@A-s*"
        arg2: "36547"
        arg3: "D3F543F4F6E3"
        arg4: "{{nationalCode}}"
        arg5: "{{cardSerial}}"
    response:
      status: 200
      map:
        image: "$.result.data.getImageSmartResponse.return.image"
    ########################################
    business_errors:       
      # message
      - when: { path: "$.result.data.getImageSmartResponse.return.message", equals: "record.not.found" }
        status: 404
        code: PERSON_NOT_FOUND
        message: "{{ $.result.data.getImageSmartResponse.return.message }}"