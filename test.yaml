schema_version: 1

service:
  name: person-inquiry
  provider: astan
  domain: test
  version: 1.0.0                  # default: 0.1.0
  labels:                         # extra GLOBAL metric labels (optional)
    team: core-banking

mode: pure

server:                           # all optional
  port: 8080                      # default: 8080 (env PORT overrides at runtime)
  read_timeout: 10s               # default: 10s
  write_timeout: 30s              # default: 30s (keep > upstream.timeout * (retries+1))
  shutdown_timeout: 15s           # default: 15s
  max_body_bytes: 1048576         # default: 1 MiB



logging:
  filePath: ./logs/
  fileName: processor-app.log
  encoding: json
  level: info
  console: true
  rotating:
    maxSize: 10       # Max size in MB before rotation
    maxBackups: 5     # Number of old log files to keep
    maxAge: 7         # Max age in days to retain old log files
    compress: true    # Compress old log files

endpoints:
  - name: get-legal-info
    method: POST
    path: /v1/astan/legal/inquiry
    params:
      - { name: nationalCode, in: body, required: true, pattern: '^[0-9]{11}$' }
    upstream:
      auth:
        type: basic
        username: { source: env, value: INQUIRY_USERNAME }
        password: { source: env, value: INQUIRY_PASSWORD }
      base_url: http://inquiryps.fam724.ir     # NOTE: plain HTTP, credentials cross the network unencrypted
      #base_url: http://127.0.0.1:8787
      base_url_env: INQUIRY_BASE_URL            # optional override (staging / local mock)
      timeout: 10s
      path: /astannix/sabteasnad/GetLatestInfo
      body:
        UserName: "MelalBank.Service"
        PassWord: "48CD7C4BFA21DFE3E0630B2A010AAA58"
        NationalCode: "{{nationalCode}}"
    response:
      status: 200
      map:
        TheCCompany : "$.result.data.TheCCompany"

    business_errors:
      - when: { path: "$.result.data.Result.Code", not_equals: "1000" }
        status: 400
        code: UPSTREAM_ERROR
        message: "{{ $.result.data.Result.Message }}"
