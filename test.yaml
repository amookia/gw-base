schema_version: 1

service:
  name: person-inquiry
  provider: astan
  domain: test
  version: 1.0.0                  # default: 0.1.0
  labels:                         # extra GLOBAL metric labels (optional)
    team: core-banking

mode: pure

server:                           # all optional
  port: 8080                      # default: 8080 (env PORT overrides at runtime)
  read_timeout: 10s               # default: 10s
  write_timeout: 30s              # default: 30s (keep > upstream.timeout * (retries+1))
  shutdown_timeout: 15s           # default: 15s
  max_body_bytes: 1048576         # default: 1 MiB



logging:
  filePath: ./logs/
  fileName: processor-app.log
  encoding: json
  level: info
  console: true
  rotating:
    maxSize: 10       # Max size in MB before rotation
    maxBackups: 5     # Number of old log files to keep
    maxAge: 7         # Max age in days to retain old log files
    compress: true    # Compress old log files


endpoints:
  - name: get-estelam3
    method: POST
    path: /v1/inquiry                       # path your clients call on the adapter
    params:
      - { name: nationalCode, in: body, required: true, pattern: '^[0-9]{10}$' }   # sent upstream as "nin"
      - { name: birthDate,    in: body, required: true, pattern: '^[0-9]{8}$' }    # yyyymmdd, e.g. 13800415
    upstream:
      base_url: http://127.0.0.1:8787      # NOTE: plain HTTP, credentials cross the network unencrypted
      base_url_env: INQUIRY_BASE_URL            # optional override (staging / local mock)
      timeout: 10s
      auth:
        type: basic
        username: { source: env, value: INQUIRY_USERNAME }
        password: { source: env, value: INQUIRY_PASSWORD }
        #type: custom
        #script: custom.lua
        #script_is_file: true
      path: /astannix/GetEstelam3
      format: json                              # body encoding: json | form (default: json)
      body:
        arg0: "meas"      # fixed values from env (not client-controllable)
        arg1: "M!e@A-s*"
        arg2: "36547"
        arg3: "D3F543F4F6E3"
        nin: "{{nationalCode}}"
        birthDate: "{{birthDate}}"
        xx: { x1: "{{birthDate}}" }
        #xx: [ x1: x2 ]


    response:
      status: 200
      map:
        birthDate: "$.result.data.getEstelam3Response.return.birthDate"
        name: { $decode: base64, path: "$.result.data.getEstelam3Response.return.name" }
        family: { $decode: base64, path: "$.result.data.getEstelam3Response.return.family" }
        fatherName: { $decode: base64, path: "$.result.data.getEstelam3Response.return.family" }
        gender: "$.result.data.getEstelam3Response.return.gender"
        officeName: "$.result.data.getEstelam3Response.return.officeName"
        shenasnameSeri: { $decode: base64, path: "$.result.data.getEstelam3Response.return.shenasnameSeri" }
        shenasnameSerial: "$.result.data.getEstelam3Response.return.shenasnameSerial"

    business_errors:                      # add once you know how failures look
      # message
      - when: { path: "$.result.data.getEstelam3Response.return.message", equals: "err.record.not.found" }
        status: 404
        code: PERSON_NOT_FOUND
        message: "{{ $.result.data.getEstelam3Response.return.message }}"
