schema_version: 1

service:
  name: person-inquiry
  provider: sitaad
  domain: test
  version: 1.0.0                  # default: 0.1.0

mode: pure

server:                           # all optional
  port: 8080                      # default: 8080 (env PORT overrides at runtime)
  read_timeout: 10s               # default: 10s
  write_timeout: 30s              # default: 30s (keep > upstream.timeout * (retries+1))
  shutdown_timeout: 15s           # default: 15s
  max_body_bytes: 1048576         # default: 1 MiB



logging:
  filePath: ./logs/
  fileName: processor-app.log
  encoding: json
  level: info
  console: true
  rotating:
    maxSize: 10       # Max size in MB before rotation
    maxBackups: 5     # Number of old log files to keep
    maxAge: 7         # Max age in days to retain old log files
    compress: true    # Compress old log files

endpoints:
  - name: inquiry2
    method: POST
    path: /v1/sitaad/person/inquiry    
    params:
      - { name: nationalCode, in: body, required: true, pattern: '^[0-9]{10}$' }
      - { name: birthDate,   in: body, required: true,  pattern: '^[0-9]{8}$' }   # e.g. 13800415
    upstream:
      base_url: http://inquiryps.fam724.ir
      path: /dispatch/{{birthDate}}
      body:
        payload:
          birthDate: "{{birthDate}}"
          bookNo: ""
          bookRow: ""
          dateHasPostfix: ""
          family: ""
          familyHasPerfix: ""
          familyHasPostfix: ""
          fatherName: ""
          gender: ""
          name: ""
          nameHasPerfix: ""
          nameHasPostfix: ""
          officeCode: ""
          officeName: ""
          shenasnameNo: ""
          shenasnameSeri: ""
          shenasnameSerial: ""
          nin: "{{nationalCode}}"
        payloadClass: "ix.microserver.registryoffice.messages.InquiryRequest"
        senderId: "melal bank"
        plainId: "20230116091236501"
        encryptedId: "CdX4YWSZHmuiAOfT"
        receiverId: "registry-office"
        service: "registry-office"
        action: "inquiry2"
        version: "1.0.0"
        timeout: ""
    response:
      status: 200
      map:
        # inqueryResults is an ARRAY of records -> first record via [0]
        birthDate:        "$.payload.inqueryResults[0].birthDate"
        bookNo:           "$.payload.inqueryResults[0].bookNo"
        bookRow:          "$.payload.inqueryResults[0].bookRow"
        deathStatus:      "$.payload.inqueryResults[0].deathStatus"
        deathDate:        "$.payload.inqueryResults[0].deathDate"
        family:           "$.payload.inqueryResults[0].family"
        fatherName:       "$.payload.inqueryResults[0].fatherName"
        gender:           "$.payload.inqueryResults[0].gender"
        name:             "$.payload.inqueryResults[0].name"
        nin:              "$.payload.inqueryResults[0].nin"
        officeCode:       "$.payload.inqueryResults[0].officeCode"
        officeName:       "$.payload.inqueryResults[0].officeName"
        shenasnameNo:     "$.payload.inqueryResults[0].shenasnameNo"
        shenasnameSeri:   "$.payload.inqueryResults[0].shenasnameSeri"
        shenasnameSerial: "$.payload.inqueryResults[0].shenasnameSerial"
        conversationId:   "$.conversationId"
    business_errors:
      - when: { path: "$.type", equals: "EXCEPTION" }
        status: 400
        code: DISPATCH_ERROR
        message: "{{ $.payload.exceptionCode }}"
